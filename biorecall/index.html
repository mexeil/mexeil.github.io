<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f9faf9"><title>BioRecall — 생명과학 암기</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#202626;background:#f8faf9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{max-width:1080px;margin:auto;padding:25px 22px 14px;display:flex;align-items:center;justify-content:space-between}a{color:inherit;text-decoration:none}.logo{font-size:21px;font-weight:800;letter-spacing:-1px}.logo span{color:#2c806d}.sub{font-size:12px;color:#7b8883}main{max-width:1080px;margin:auto;padding:15px 22px 70px}.hero{margin:15px 0 25px}.hero h1{font-size:clamp(25px,4vw,38px);font-weight:750;letter-spacing:-1.6px;margin:0 0 7px}.hero p{color:#76817e;font-size:14px;margin:0}.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}.panel{background:white;border:1px solid #e7ece8;border-radius:18px;padding:22px;min-width:0}.section-title{font-weight:750;font-size:15px;margin:0 0 14px}.muted{color:#8a9690;font-size:12px;line-height:1.65}.drop{border:1.5px dashed #cbdcd4;background:#f9fcfa;border-radius:14px;padding:21px 12px;text-align:center;cursor:pointer;margin-bottom:12px}.drop strong{display:block;font-size:13px;margin:7px 0 4px}.drop small{font-size:11px;color:#95a19a}.drop:hover{border-color:#51a18a}input[type=file]{display:none}textarea,input[type=text],select{width:100%;border-radius:10px;border:1px solid #e2e8e4;background:white;padding:11px;color:#26332c;outline:none}textarea:focus,input:focus{border-color:#56a48b}textarea{resize:vertical;min-height:118px;font-size:12px;line-height:1.7}.btn{background:white;border:1px solid #e0e8e3;color:#37453d;border-radius:10px;padding:10px 13px;font-weight:650;font-size:13px}.btn.primary{background:#287d67;color:white;border-color:#287d67}.btn:disabled{opacity:.4;cursor:default}.btn:hover:not(:disabled){filter:brightness(.96)}.btn.full{width:100%}.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.divider{border:0;border-top:1px solid #eef2ef;margin:20px 0}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.stat{background:#f7faf8;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:21px;font-weight:750}.stat span{font-size:11px;color:#8c9992}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 24px}.tab{padding:9px 11px;border:1px solid #e4eae6;background:white;border-radius:9px;color:#68796f;font-size:12px;font-weight:650}.tab.active{background:#e7f4ee;border-color:#b7dccb;color:#266f57}.qtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8b9890}.progress{height:5px;background:#edf1ed;border-radius:99px;margin:12px 0 27px;overflow:hidden}.progress div{height:100%;background:#32977b;transition:width .2s}.question{font-size:clamp(19px,2.3vw,25px);line-height:1.7;font-weight:650;letter-spacing:-.5px;min-height:105px;word-break:keep-all}.question .blank{color:#26876c;border-bottom:2px solid #26876c}.answers{display:grid;gap:9px;margin:15px 0}.choice,.step{border:1px solid #e5ebe6;background:white;padding:13px 15px;border-radius:11px;text-align:left;font-size:14px}.choice:hover,.step:hover{background:#f5faf7}.choice.selected,.step.selected{border-color:#388b70;background:#edf7f1}.feedback{font-size:13px;line-height:1.6;margin:14px 0;padding:12px 14px;border-radius:10px;background:#f3f8f5;color:#315d4c}.feedback.bad{background:#fcf4f2;color:#944f48}.flash{border:1px solid #e5ece7;background:#fafdfa;border-radius:18px;min-height:190px;display:grid;place-items:center;padding:30px;text-align:center;cursor:pointer;font-size:20px;font-weight:680;line-height:1.6;margin:12px 0 17px}.flash small{display:block;font-size:12px;font-weight:400;color:#93a39a;margin-top:14px}.empty{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#7d8b84;padding:28px}.empty svg{opacity:.6}.empty h3{font-size:17px;color:#3b4b41;margin:15px 0 3px}.empty p{font-size:13px;line-height:1.7;max-width:350px}.hint{font-size:12px;color:#83938a}.tag{font-size:11px;border-radius:20px;padding:5px 9px;background:#edf6f1;color:#368369}.steps{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.step{width:auto}.step[disabled]{opacity:.5}.selectedstep{padding:12px;border-radius:11px;background:#edf8f2;min-height:45px;line-height:1.7;font-size:13px}.hidden{display:none!important}@media(max-width:760px){header{padding:18px 17px 7px}main{padding:10px 14px 50px}.layout{grid-template-columns:1fr}.panel{padding:18px}.hero{margin:14px 0 19px}.tabs{margin-top:7px}.question{min-height:75px}}
</style></head>
<body><header><div class="logo">bio<span>recall.</span></div><div class="sub">생명과학 반복 암기</div></header><main>
<div class="hero"><h1>외우는 데 집중하세요.</h1><p>개념을 넣으면 빈칸, 순서 배열, 객관식, 플래시카드로 바뀝니다.</p></div>
<div class="layout"><aside class="panel">
<h2 class="section-title">학습 자료</h2>
<label class="drop" id="drop"><div style="font-size:25px;color:#5f9f86">＋</div><strong>파일을 선택하거나 여기로 드래그</strong><small>PDF · 스캔 사진 · TXT</small><input type="file" id="file" accept=".pdf,.txt,.md,image/*" multiple></label>
<div class="muted" id="status">자료를 업로드하거나 아래에 직접 입력하세요.</div>
<div style="margin-top:13px"><textarea id="source" placeholder="예: DNA → RNA → 단백질&#10;전사는 DNA를 주형으로 RNA를 합성하는 과정이다.&#10;번역은 리보솜에서 mRNA를 읽어 단백질을 합성하는 과정이다."></textarea></div>
<div class="stack" style="margin-top:12px"><button class="btn primary full" id="generate">문제 만들기</button><button class="btn full" id="sample">예시로 체험하기</button></div>
<hr class="divider">
<h2 class="section-title">반복 학습</h2>
<div class="row between"><span class="hint">오답만 학습</span><input type="checkbox" id="wrongOnly" style="accent-color:#287d67;width:18px;height:18px"></div>
<p class="muted">정답은 기록되고 오답은 다시 풀 수 있습니다. 이 기기의 브라우저에 학습 자료가 저장됩니다.</p>
<div class="row"><button class="btn" id="reset">진도 초기화</button><button class="btn" id="clear">자료 지우기</button></div>
</aside>
<section class="panel">
<div class="statrow"><div class="stat"><b id="total">0</b><span>전체 문제</span></div><div class="stat"><b id="right">0</b><span>맞힌 횟수</span></div><div class="stat"><b id="miss">0</b><span>오답 문제</span></div></div>
<div class="tabs" id="tabs"><button class="tab active" data-mode="cloze">빈칸</button><button class="tab" data-mode="short">단답</button><button class="tab" data-mode="multi">4지선다</button><button class="tab" data-mode="order">기작 순서</button><button class="tab" data-mode="flash">플래시카드</button></div>
<div id="study"></div>
</section></div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={source:'',questions:[],mode:'cloze',idx:0,review:{},right:0};try{Object.assign(data,JSON.parse(localStorage.getItem('biorecall_v2')||'{}'))}catch{}
let answerState='',answered=false,orderPick=[],flashBack=false;
const save=()=>{localStorage.setItem('biorecall_v2',JSON.stringify(data))},shuffle=a=>[...a].sort(()=>Math.random()-.5);
function sentences(t){return t.replace(/\r/g,'').split(/\n|(?<=[.!?。])\s+/).map(s=>s.trim()).filter(s=>s.length>=9&&s.length<320)}
const stop=new Set('것 이 그 및 또는 하는 한다 있다 있다면 대한 대해 통해 관련 과정 결과 경우 세포 생물 생명 이것 그때 다음 때문에 또한 각각 여러 모두 에서 으로 로부터 이다 된다 된다면 하나 일부 등의 등이 특정'.split(' '));
function term(s){let m=[...s.matchAll(/([A-Za-z][A-Za-z0-9-]{2,}|[가-힣]{2,10})(?=은|는|이|가|을|를|에서|에|의|로|과|와|란|이다|하고|한다|된다|,|\s)/g)].map(x=>x[1]);m=m.filter(w=>!stop.has(w)&&!/^(그리고|그러나|따라서|하지만|있으며|있다|되며|하는|이러한|이를)$/.test(w));if(!m.length)m=s.match(/[A-Za-z][\w-]{2,}|[가-힣]{2,}/g)||[];return m.sort((a,b)=>b.length-a.length)[0]||null}
function build(text){let qs=[],id=0;for(const s of sentences(text)){let arrows=s.split(/\s*(?:→|⇒|->|➜|⟶)\s*/).map(x=>x.trim().replace(/[.。]$/,'')).filter(Boolean);if(arrows.length>=3){qs.push({id:id++,type:'order',steps:arrows.slice(0,10),sentence:s});continue}let w=term(s);if(w&&s.includes(w)){qs.push({id:id++,type:'fact',sentence:s,term:w})}}
return qs.slice(0,600)}
function available(){let a=data.questions.filter(q=>data.mode==='order'?q.type==='order':q.type==='fact');if($('#wrongOnly').checked)a=a.filter(q=>data.review[q.id]==='wrong');return a}
function stats(){ $('#total').textContent=data.questions.length;$('#right').textContent=data.right;$('#miss').textContent=Object.values(data.review).filter(v=>v==='wrong').length;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===data.mode))}
function render(){stats();let a=available(),root=$('#study');if(!a.length){root.innerHTML='<div class="empty"><div style="font-size:36px">◌</div><h3>학습할 문제가 없습니다</h3><p>'+ (data.questions.length?'이 유형에 해당하는 문제가 없거나 오답이 남아 있지 않습니다. 다른 유형을 선택하세요.':'왼쪽에 개념 파일을 올리거나 텍스트를 입력한 뒤 문제를 만들어 주세요.')+'</p></div>';return}
data.idx=((data.idx%a.length)+a.length)%a.length;let q=a[data.idx];answered=false;answerState='';orderPick=[];flashBack=false;
let html='<div class="qtop"><span>'+esc(({cloze:'빈칸 채우기',short:'단답형',multi:'4지선다',order:'기작 순서 배열',flash:'플래시카드'})[data.mode])+'</span><span>'+(data.idx+1)+' / '+a.length+'</span></div><div class="progress"><div style="width:'+((data.idx+1)/a.length*100)+'%"></div></div>';
if(q.type==='order'){html+='<div class="question">다음 기작을 올바른 순서로 배열하세요.</div><div class="selectedstep" id="selectedsteps">선택한 단계가 여기에 표시됩니다.</div><div class="steps" id="steps"></div><div class="row"><button class="btn" id="undo">한 단계 취소</button><button class="btn primary" id="check">정답 확인</button></div>'}
else if(data.mode==='flash'){html+='<div class="flash" id="flip"><div id="cardtext">'+esc(q.sentence.replace(q.term,'______'))+'<small>카드를 눌러 정답 확인</small></div></div><div class="row" id="flashBtns" style="justify-content:center"><button class="btn" id="bad">모름</button><button class="btn primary" id="good">알고 있음</button></div>'}
else{let prompt=q.sentence.replace(q.term,'______');html+='<div class="question">'+esc(prompt).replace('______','<span class="blank">________</span>')+'</div>';if(data.mode==='multi'){let distractors=shuffle(data.questions.filter(x=>x.type==='fact'&&x.term!==q.term).map(x=>x.term).filter((v,i,a)=>a.indexOf(v)===i)).slice(0,3);while(distractors.length<3)distractors.push(['핵','세포질','리보솜','ATP','효소'].filter(x=>x!==q.term&&!distractors.includes(x))[0]||'기타');html+='<div class="answers">'+shuffle([q.term,...distractors]).map(x=>'<button class="choice" data-answer="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'}else html+='<input type="text" id="typed" autocomplete="off" placeholder="정답을 입력하세요" aria-label="정답 입력"><div style="margin-top:12px"><button class="btn primary" id="check">정답 확인</button></div>'}
html+='<div class="hint" style="margin-top:12px">문장이 어색하거나 정답이 잘못 추출되었다면 원본 텍스트를 수정한 후 다시 생성하세요.</div>'}
html+='<div id="feedback"></div><div class="row between" style="margin-top:24px"><button class="btn" id="prev">이전</button><button class="btn primary" id="next">다음 문제 →</button></div>';root.innerHTML=html;
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
if(q.type==='order'){let opts=shuffle(q.steps.map((v,i)=>({v,i})));function draw(){ $('#steps').innerHTML=opts.map(o=>'<button class="step" data-i="'+o.i+'" '+(orderPick.includes(o.i)?'disabled':'')+'>'+esc(o.v)+'</button>').join('');$('#selectedsteps').textContent=orderPick.length?orderPick.map(i=>q.steps[i]).join(' → '):'선택한 단계가 여기에 표시됩니다.';document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{orderPick.push(+b.dataset.i);draw()})}draw();$('#undo').onclick=()=>{orderPick.pop();draw()};$('#check').onclick=()=>grade(orderPick.length===q.steps.length&&orderPick.every((v,i)=>v===i),q)}
else if(data.mode==='flash'){$('#flip').onclick=()=>{flashBack=!flashBack;$('#cardtext').innerHTML=flashBack?esc(q.term)+'<small>다시 눌러 문제 보기</small>':esc(q.sentence.replace(q.term,'______'))+'<small>카드를 눌러 정답 확인</small>'};$('#good').onclick=()=>grade(true,q);$('#bad').onclick=()=>grade(false,q)}
else if(data.mode==='multi'){document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;b.classList.add('selected');grade(b.dataset.answer===q.term,q)})}
else{$('#check').onclick=()=>grade($('#typed').value.trim().replace(/\s+/g,'').toLowerCase()===q.term.replace(/\s+/g,'').toLowerCase(),q);$('#typed').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#check').click()}}}}
function grade(ok,q){if(answered)return;answered=true;data.review[q.id]=ok?'right':'wrong';if(ok)data.right++;save();stats();$('#feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'">'+(ok?'정답입니다.':'다시 복습할 문제로 저장했습니다.')+'<br><b>정답: '+esc(q.type==='order'?q.steps.join(' → '):q.term)+'</b></div>'}
function move(n){let a=available();if(!a.length){render();return}data.idx=(data.idx+n+a.length)%a.length;save();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{data.mode=b.dataset.mode;data.idx=0;save();render()});$('#wrongOnly').onchange=()=>{data.idx=0;render()};
$('#generate').onclick=()=>{let t=$('#source').value.trim();if(!t){$('#status').textContent='텍스트를 입력하거나 파일을 선택하세요.';return}data.source=t;data.questions=build(t);data.idx=0;data.review={};data.right=0;save();$('#status').textContent=data.questions.length+'개 문항 생성 완료 · 순서 배열 '+data.questions.filter(q=>q.type==='order').length+'개';render()};
$('#sample').onclick=()=>{$('#source').value='DNA → RNA → 단백질\n전사는 DNA의 유전정보를 RNA로 옮기는 과정이다.\n번역은 리보솜에서 mRNA 정보를 이용하여 폴리펩타이드를 합성하는 과정이다.\n해당과정 → 피루브산 산화 → 시트르산 회로 → 전자전달계\n미토콘드리아는 세포 호흡의 주요 장소이다.\n리보솜은 단백질을 합성하는 세포 소기관이다.\nATP는 세포에서 에너지를 전달하는 데 이용된다.\n감수분열은 염색체 수가 절반으로 감소하는 세포 분열이다.';$('#generate').click()};
$('#reset').onclick=()=>{data.review={};data.right=0;data.idx=0;save();render()};$('#clear').onclick=()=>{if(!confirm('저장된 학습 자료를 지울까요?'))return;data={source:'',questions:[],mode:'cloze',idx:0,review:{},right:0};$('#source').value='';save();render()};
let libPromise={};function loadScript(url){return libPromise[url] ||= new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.append(s)})}
async function readPDF(file){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let parts=[];for(let i=1;i<=doc.numPages;i++){let page=await doc.getPage(i);let tc=await page.getTextContent();let text=tc.items.map(x=>x.str).join(' ');if(text.trim().length<25){$('#status').textContent='스캔 PDF 문자 인식 중 ('+i+'/'+doc.numPages+')';let viewport=page.getViewport({scale:1.6});let canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;text=await ocr(canvas)}parts.push(text)}return parts.join('\n')}
async function ocr(image){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');let result=await Tesseract.recognize(image,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('#status').textContent='문자 인식 '+Math.round(m.progress*100)+'%'}});return result.data.text}
async function upload(files){for(let f of files){$('#status').textContent=f.name+' 읽는 중…';try{let content=f.type.startsWith('image/')?await ocr(f):/\.pdf$/i.test(f.name)?await readPDF(f):await f.text();$('#source').value+=($('#source').value?'\n':'')+content;$('#status').textContent=f.name+' 불러오기 완료. 텍스트 확인 후 문제 만들기를 누르세요.'}catch(err){$('#status').textContent='파일 처리 실패: '+err.message+'. 스캔 자료는 인터넷 연결이 필요합니다.'}}}
$('#file').onchange=e=>upload([...e.target.files]);$('#drop').onclick=e=>{if(e.target.id!=='file')$('#file').click()};$('#drop').ondragover=e=>{e.preventDefault()};$('#drop').ondrop=e=>{e.preventDefault();upload([...e.dataTransfer.files])};
$('#source').value=data.source||'';render();
</script></body></html>
