<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHASE | 나만의 물리학습</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#17243d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#142348;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:25px;letter-spacing:-.6px}header small{color:#c7d7ef}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 85px)}aside{background:white;border-right:1px solid #e3e9f3;padding:20px}aside button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 14px;border-radius:10px;cursor:pointer;color:#35445e;font-size:15px}aside button.active,aside button:hover{background:#eaf0ff;color:#2249ad;font-weight:700}main{padding:30px 4%;max-width:1250px;width:100%;margin:auto}h2{font-size:25px;margin:0 0 8px}h3{font-size:18px;margin:0 0 14px}.muted{color:#63718b}.panel{background:white;border:1px solid #e2e8f2;border-radius:16px;padding:23px;margin:18px 0;box-shadow:0 3px 12px #172b5110}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.tile{padding:20px;border:1px solid #dce5f1;border-radius:13px;background:#fff;cursor:pointer;text-align:left;min-height:105px}.tile:hover{border-color:#5880db;background:#f9fbff}.tile strong{display:block;margin-bottom:9px}.pill{display:inline-block;background:#eaf0ff;color:#3454a5;padding:5px 9px;border-radius:20px;font-size:12px;margin-right:5px}.primary{background:#355ddd;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:650}.secondary{background:white;border:1px solid #ccd8e9;color:#253b65;border-radius:10px;padding:11px 15px;cursor:pointer}button:disabled{opacity:.45;cursor:default}input,select,textarea{font:inherit;border:1px solid #cdd9e7;border-radius:9px;padding:11px;background:#fff;max-width:100%}textarea{width:100%;min-height:100px;resize:vertical}input[type=file]{max-width:100%;width:100%}label{display:block;font-weight:650;margin:14px 0 7px}.stages{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.stage{border:1px solid #d1dceb;background:white;padding:10px 12px;border-radius:11px;cursor:pointer}.stage.active{background:#355ddd;color:white}.stage.done{border-color:#76aa91}.choices{display:flex;flex-wrap:wrap;gap:10px}.choices button{padding:11px 14px;border:1px solid #cbd9ec;background:#fff;border-radius:10px;cursor:pointer}.choices button.picked{border:2px solid #3667d3;background:#edf3ff}.flex{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.notice{background:#fff8e8;border:1px solid #f0daa5;padding:14px;border-radius:10px;color:#72531a}.pdfview{background:#ebeff7;border:1px solid #d4deeb;border-radius:10px;max-height:610px;overflow:auto;text-align:center;padding:10px}canvas{max-width:100%;height:auto;background:white;box-shadow:0 1px 8px #0002;touch-action:none}#draw{width:100%;height:250px;touch-action:none;border:1px dashed #aac0da;border-radius:10px;background:#fbfdff;box-shadow:none}.small{font-size:13px}hr{border:0;border-top:1px solid #e2e8f2;margin:20px 0}.stat{font-size:28px;font-weight:800;color:#284cc3}#status{position:fixed;right:15px;bottom:15px;background:#223b66;color:#fff;padding:12px 18px;border-radius:10px;display:none;max-width:350px} @media(max-width:760px){.layout{display:block}aside{border-bottom:1px solid #e2e8f2;padding:8px;display:flex;overflow:auto;gap:3px}aside button{white-space:nowrap;width:auto}main{padding:18px}header{padding:15px}.panel{padding:17px}.stage{font-size:12px}}
</style></head><body><header><div><h1>PHASE <small>Physics Study</small></h1><small>나만의 고급 물리학 단계별 학습실</small></div><span class="pill">개인 브라우저 저장</span></header><div class="layout"><aside id="nav"></aside><main id="main"></main></div><div id="status"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='phase_state_4';let state=JSON.parse(localStorage.getItem(KEY)||'{"docs":[],"history":[],"steps":{}}'),current=null,page=1,step=0,level='easy',selected=[],pdfDoc=null,draw=[],isDrawing=false;
const examples=[
{id:'e1',title:'수평면의 뉴턴 법칙',topic:'운동과 뉴턴 법칙',q:'마찰이 없는 수평면에서 질량 2 kg인 물체에 오른쪽으로 12 N의 힘을 가한다. 가속도를 구하시오.',base:12,m:2,kind:'newton',formula:'F=ma',answer:6},
{id:'e2',title:'운동 마찰력',topic:'운동과 뉴턴 법칙',q:'질량 4 kg인 물체가 수평면 위에서 미끄러진다. 운동 마찰계수는 0.25이고 g=10 m/s²이다. 마찰력의 크기를 구하시오.',kind:'friction',m:4,mu:.25,answer:10,formula:'f=μN'},
{id:'e3',title:'일과 에너지',topic:'일과 에너지',q:'질량 2 kg인 물체가 정지 상태에서 5 m/s로 빨라졌다. 알짜힘이 한 일을 구하시오.',kind:'energy',m:2,v:5,answer:25,formula:'W=ΔK'},
{id:'e4',title:'용수철 진동',topic:'조화진동',q:'질량 1 kg인 물체를 용수철 상수 100 N/m인 용수철에 연결하였다. 각진동수를 구하시오.',kind:'spring',m:1,k:100,answer:10,formula:'ω=√(k/m)'},
{id:'e5',title:'등속 원운동',topic:'운동과 뉴턴 법칙',q:'질량 2 kg인 물체가 반지름 4 m인 원을 6 m/s로 등속 원운동한다. 구심력의 크기를 구하시오.',kind:'circle',m:2,r:4,v:6,answer:18,formula:'F=mv²/r'},
{id:'e6',title:'회전 운동',topic:'회전 운동',q:'관성모멘트가 3 kg·m²인 물체에 12 N·m의 알짜 토크를 가한다. 각가속도를 구하시오.',kind:'torque',I:3,tau:12,answer:4,formula:'τ=Iα'},
{id:'e7',title:'만유인력',topic:'행성의 운동',q:'질량 M을 가진 천체 주위에서 반지름 r인 원 궤도로 공전하는 물체의 속력과 관련된 공식은?',kind:'orbit',formula:'v=√(GM/r)',answer:null}
];
const formulae=[['운동과 뉴턴 법칙','ΣF=ma','알짜힘으로 가속도 판단'],['운동과 뉴턴 법칙','v=v₀+at','등가속도 속력'],['운동과 뉴턴 법칙','v²=v₀²+2aΔx','시간이 없는 등가속도'],['입자계의 운동','r_cm=Σmᵢrᵢ/Σmᵢ','질량중심'],['입자계의 운동','Σp전=Σp후','외력 충격량이 없을 때'],['회전 운동','τ=rF sinθ','회전축에 대한 토크'],['회전 운동','Στ=Iα','회전운동 방정식'],['회전 운동','K회전=½Iω²','회전 운동에너지'],['일과 에너지','W=∫F·dr=ΔK','일-에너지 정리'],['일과 에너지','K+U=일정','보존력만 작용할 때'],['조화진동','ω=√(k/m)','용수철 진동'],['조화진동','T=2π√(m/k)','용수철 주기'],['조화진동','T=2π√(ℓ/g)','작은 각 진자'],['행성의 운동','F=GMm/r²','만유인력'],['행성의 운동','T²=4π²r³/GM','원 궤도 공전주기']];
const navs=[['home','대시보드'],['files','자료·PDF 업로드'],['concept','통합 개념'],['sets','파일별 문제집'],['practice','단계별 학습'],['formula','공식 암기'],['report','학습 기록']];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('#status').textContent=s;$('#status').style.display='block';setTimeout(()=>$('#status').style.display='none',2500)}
function renderNav(active){$('#nav').innerHTML=navs.map(([k,v])=>'<button class="'+(active===k?'active':'')+'" onclick="show(\''+k+'\')">'+v+'</button>').join('')}
function show(k){renderNav(k);({home:home,files:files,concept:concept,sets:sets,practice:practice,formula:formula,report:report}[k])()}
function home(){let cs=state.docs.filter(x=>x.type==='concept'),qs=state.docs.filter(x=>x.type==='question');$('#main').innerHTML='<h2>오늘의 물리 학습</h2><p class="muted">자료를 업로드하면 개념은 한곳으로, 문제는 파일별 문제집으로 정리됩니다.</p><div class="grid"><div class="panel"><div class="muted">개념 자료</div><div class="stat">'+cs.length+'개</div></div><div class="panel"><div class="muted">문제 파일</div><div class="stat">'+qs.length+'개</div></div><div class="panel"><div class="muted">학습 기록</div><div class="stat">'+state.history.length+'회</div></div></div><div class="panel"><h3>바로 시작</h3><div class="grid"><button class="tile" onclick="show(\'files\')"><strong>자료 추가</strong><span class="muted">PDF를 선택하면 문제를 자동 분류</span></button><button class="tile" onclick="startExample(0)"><strong>5단계 학습 체험</strong><span class="muted">자유물체도부터 계산까지 연습</span></button><button class="tile" onclick="show(\'sets\')"><strong>내 문제집</strong><span class="muted">파일별로 문제 선택</span></button></div></div><p class="notice small">업로드한 PDF와 기록은 이 기기의 브라우저에 보관됩니다. 로그인·클라우드 동기화나 AI 풀이 서버는 연결되어 있지 않습니다. 브라우저 데이터를 삭제하면 자료가 사라질 수 있습니다.</p>'}
function files(){let list=state.docs.map(d=>'<div class="tile"><strong>'+esc(d.name)+'</strong><span class="pill">'+(d.type==='concept'?'통합 개념':'문제집')+'</span><span class="muted">'+d.pages+'쪽 · '+(d.questions?.length||0)+'문항 후보</span><p><button class="secondary" onclick="openDoc(\''+d.id+'\',1)">열기</button> <button class="secondary" onclick="removeDoc(\''+d.id+'\')">삭제</button></p></div>').join('');$('#main').innerHTML='<h2>PDF 자료 관리</h2><p class="muted">PDF를 올리면 이름과 문서 구조를 분석해 개념 자료 또는 문제집으로 등록합니다. 분류는 직접 수정할 수 있습니다.</p><div class="panel"><h3>파일 추가</h3><input type="file" id="upload" accept=".pdf,application/pdf" multiple onchange="uploadPDFs(this.files)"><p class="small muted">처음 업로드한 파일은 브라우저 안에만 저장되며 공개 웹 저장소로 전송하지 않습니다.</p></div><div class="grid">'+list+'</div>'}
function connectDB(){return new Promise((res,rej)=>{let req=indexedDB.open('phase_private_pdfs',1);req.onupgradeneeded=()=>req.result.createObjectStore('pdfs');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function putPDF(id,buf){let db=await connectDB();return new Promise((res,rej)=>{let t=db.transaction('pdfs','readwrite');t.objectStore('pdfs').put(buf,id);t.oncomplete=res;t.onerror=rej})}
async function getPDF(id){let db=await connectDB();return new Promise((res,rej)=>{let t=db.transaction('pdfs','readonly'),q=t.objectStore('pdfs').get(id);q.onsuccess=()=>res(q.result);q.onerror=rej})}
async function removeDoc(id){if(!confirm('이 자료를 삭제할까요?'))return;state.docs=state.docs.filter(x=>x.id!==id);save();let db=await connectDB();db.transaction('pdfs','readwrite').objectStore('pdfs').delete(id);files()}
async function uploadPDFs(fs){if(!window.pdfjsLib)return toast('PDF 분석 라이브러리를 불러오지 못했습니다. 인터넷을 확인하세요.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';for(let f of fs){try{toast(f.name+' 분석 중');let buf=await f.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,id='d'+Date.now()+Math.random().toString(36).slice(2,6),type=/개념|뉴턴 법칙|입자계의 운동|회전 운동|일과 에너지|조화진동|행성의 운동|^0[2-7]\./.test(f.name)&&!/방과후|문제|회차|차시/.test(f.name)?'concept':'question',questions=[];if(type==='question'){let last=0;for(let p=1;p<=pdf.numPages;p++){let pg=await pdf.getPage(p),items=(await pg.getTextContent()).items;for(let item of items){let s=item.str.trim(),match=s.match(/^(\d{1,2})\s*[.．]\s*/);if(match){let n=Number(match[1]);if(n>=1&&n<=50&&n!==last){questions.push({n,p,title:'문제 '+n});last=n}}}}if(!questions.length){for(let p=1;p<=pdf.numPages;p++)questions.push({n:p,p,title:'페이지 '+p+' 문제'})}questions.sort((a,b)=>a.n-b.n);questions=questions.filter((x,i,a)=>i===0||x.n!==a[i-1].n)}await putPDF(id,buf);state.docs.push({id,name:f.name,pages:pdf.numPages,type,questions});save()}catch(e){toast('읽기 실패: '+f.name+' '+e.message)}}files();toast('업로드 완료')}
function concept(){let docs=state.docs.filter(d=>d.type==='concept');$('#main').innerHTML='<h2>통합 개념실</h2><p class="muted">개념 파일은 한곳에서 이어서 읽을 수 있어요.</p><div class="grid">'+(docs.length?docs.map(d=>'<button class="tile" onclick="openDoc(\''+d.id+'\',1)"><strong>'+esc(d.name)+'</strong>'+d.pages+'쪽 열기</button>').join(''):'<div class="notice">개념 PDF를 먼저 업로드하세요.</div>')+'</div><div class="panel"><h3>전체 공식 빠르게 보기</h3>'+formulae.map(f=>'<p><span class="pill">'+f[0]+'</span> <strong>'+f[1]+'</strong> — '+f[2]+'</p>').join('')+'</div>'}
function sets(){let docs=state.docs.filter(d=>d.type==='question');$('#main').innerHTML='<h2>파일별 문제집</h2><p class="muted">업로드한 문제 PDF마다 독립적인 문제집이 생깁니다.</p><div class="grid">'+(docs.length?docs.map(d=>'<button class="tile" onclick="openSet(\''+d.id+'\')"><strong>'+esc(d.name)+'</strong><span class="muted">'+d.questions.length+'문항 후보</span></button>').join(''):'<div class="notice">방과후 문제 PDF를 올리면 이곳에 나타납니다.</div>')+'</div>'}
function openSet(id){let d=state.docs.find(x=>x.id===id);$('#main').innerHTML='<div class="flex"><h2>'+esc(d.name)+'</h2><button class="secondary" onclick="show(\'sets\')">목록으로</button></div><p class="muted">자동 추출된 번호는 PDF 글꼴이나 지면 배치에 따라 누락될 수 있습니다. 페이지로도 확인하세요.</p><div class="grid">'+d.questions.map((q,i)=>'<button class="tile" onclick="startPDF(\''+id+'\','+i+')"><strong>'+esc(q.title)+'</strong><span class="muted">원본 '+q.p+'쪽 · 단계별 풀기</span></button>').join('')+'</div><div class="panel"><label>번호 탐지 오류가 있다면 페이지 직접 열기</label><input type="number" id="pg" min="1" max="'+d.pages+'" value="1"><button class="secondary" onclick="openDoc(\''+id+'\',Number($(\'#pg\').value))">페이지 열기</button></div>'}
async function openDoc(id,p){let d=state.docs.find(x=>x.id===id);$('#main').innerHTML='<div class="flex"><h2>'+esc(d.name)+'</h2><button class="secondary" onclick="show(\''+(d.type==='concept'?'concept':'sets')+'\')">돌아가기</button></div><div class="panel"><div class="flex"><button class="secondary" onclick="openDoc(\''+id+'\','+Math.max(1,p-1)+')">이전</button><span>'+p+' / '+d.pages+'쪽</span><button class="secondary" onclick="openDoc(\''+id+'\','+Math.min(d.pages,p+1)+')">다음</button></div><div class="pdfview"><canvas id="pdfcanvas"></canvas></div></div>';await drawPDF(id,p,'pdfcanvas')}
async function drawPDF(id,p,canvasId){try{if(!window.pdfjsLib)throw Error('PDF 라이브러리 미로드');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let buf=await getPDF(id);if(!buf)throw Error('저장된 PDF가 없습니다');let pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,pg=await pdf.getPage(Math.max(1,Math.min(p,pdf.numPages))),vp=pg.getViewport({scale:1.35}),c=document.getElementById(canvasId);if(!c)return;c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}catch(e){toast(e.message)}}
function startPDF(id,i){let d=state.docs.find(x=>x.id===id);current={type:'pdf',id,index:i,...d.questions[i],setName:d.name};step=0;level='easy';selected=[];practice()}
function startExample(i){current={type:'example',index:i,...examples[i]};step=0;level='easy';selected=[];practice()}
function practice(){if(!current){$('#main').innerHTML='<h2>단계별 문제 풀이</h2><p class="muted">기본 예제로 바로 연습하거나 PDF 문제집에서 문제를 선택하세요.</p><div class="grid">'+examples.map((e,i)=>'<button class="tile" onclick="startExample('+i+')"><strong>'+e.title+'</strong><span class="pill">'+e.topic+'</span></button>').join('')+'</div>';return}let isPDF=current.type==='pdf';let names=['상황 이해·자유물체도','운동 예측','공식 선택','공식 변형','수치 대입·풀이'];$('#main').innerHTML='<div class="flex"><div><h2>'+(isPDF?esc(current.setName)+' · 문제 '+current.n:current.title)+'</h2><span class="muted">'+(isPDF?'학교 원본 문제':'기본 예제')+'</span></div><button class="secondary" onclick="current=null;practice()">다른 문제</button></div><div class="stages">'+names.map((x,i)=>'<button class="stage '+(i===step?'active':'')+'" onclick="step='+i+';selected=[];practice()">'+(i+1)+'. '+x+'</button>').join('')+'</div><div class="panel">'+(isPDF?'<h3>원본 문제 페이지</h3><div class="pdfview"><canvas id="problemcanvas"></canvas></div><p class="small muted">문제가 한 페이지에 여러 개 있으면 해당 문제를 확인하고 아래에 풀이를 기록하세요.</p>':'<h3>문제</h3><p>'+esc(current.q)+'</p>')+'</div><div class="panel"><div class="flex"><h3>'+names[step]+'</h3><label>단계 난이도 <select id="lvl" onchange="level=this.value;selected=[];practice()"><option value="easy" '+(level==='easy'?'selected':'')+'>쉬움 · 보기형</option><option value="normal" '+(level==='normal'?'selected':'')+'>보통 · 직접 입력</option><option value="hard" '+(level==='hard'?'selected':'')+'>도전 · 도움 없이</option></select></label></div><div id="work"></div><hr><div class="flex"><button class="secondary" onclick="step=Math.max(0,step-1);practice()" '+(step===0?'disabled':'')+'>이전 단계</button><button class="primary" onclick="recordStep()">저장하고 다음 단계</button></div></div>';if(isPDF)drawPDF(current.id,current.p,'problemcanvas');renderStep()}
function renderStep(){let key=current.type+':'+(current.id||'')+':'+(current.n||current.index)+':'+step,old=state.steps[key]||'',prompts=['물체에 작용하는 힘을 구분하고 방향을 표시하세요.','알짜힘, 가속도, 속도 방향을 구분해 예측하세요.','어떤 물리 원리를 써야 할지 결정하세요.','구하려는 물리량을 왼쪽에 놓고 식을 정리하세요.','주어진 값을 대입해 답과 단위를 적으세요.'];let html='<p class="muted">'+prompts[step]+'</p>';if(step===0){html+='<p class="small">아래 영역에 힘 화살표를 직접 그릴 수 있습니다.</p><canvas id="draw" width="750" height="250"></canvas><p><button class="secondary" onclick="draw=[];paint()">그림 지우기</button></p>'}if(level==='easy'){let opts=step===0?['중력 ↓','수직항력 ↑','장력 ↗','마찰력 ←','탄성력 →','외력 →','구심력(알짜힘)']:step===1?['알짜힘 방향으로 가속','속도 방향과 가속도는 항상 같다','알짜힘 0이면 가속도 0','평형점 방향으로 복원','원운동에서는 중심 방향 가속','회전은 알짜 토크로 판단']:step===2?formulae.map(x=>x[1]):step===3?['F=ma ⇒ a=F/m','τ=Iα ⇒ α=τ/I','ω=√(k/m)','W=½m(v²−v₀²)','f=μmg','F=mv²/r','T=2π√(m/k)']:['계산값과 단위 기입','부호·방향 점검','주어진 값 다시 확인'];html+='<div class="choices">'+opts.map((o,i)=>'<button type="button" onclick="selectOption(this)" class="'+(selected.includes(o)?'picked':'')+'">'+esc(o)+'</button>').join('')+'</div><p class="small muted">보기를 선택한 뒤 아래에 근거를 적어도 됩니다. PDF 문제의 선택은 자동 정답 판정이 아닙니다.</p>'}if(level!=='easy'||step!==0)html+='<textarea id="answer" placeholder="내 풀이·식·값을 입력하세요">'+esc(old)+'</textarea>';if(step===4&&current.type==='example'&&current.answer!==null)html+='<button class="secondary" onclick="checkExample()">기본 예제 정답 확인</button><div id="feedback"></div>';if(current.type==='pdf')html+='<p class="notice small">원본 PDF에서 문항과 정답을 AI가 자동 검증하는 서버는 아직 없습니다. 현재 단계별 풀이 저장과 원본 확인이 가능합니다.</p>';$('#work').innerHTML=html;if(step===0){let c=$('#draw'),ctx=c.getContext('2d');paint();c.onpointerdown=e=>{isDrawing=true;let r=c.getBoundingClientRect();draw.push([[e.offsetX*c.width/r.width,e.offsetY*c.height/r.height]])};c.onpointermove=e=>{if(!isDrawing)return;let r=c.getBoundingClientRect();draw.at(-1).push([e.offsetX*c.width/r.width,e.offsetY*c.height/r.height]);paint()};c.onpointerup=()=>isDrawing=false;c.onpointerleave=()=>isDrawing=false}}
function paint(){let c=$('#draw');if(!c)return;let ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#e8eef7';ctx.beginPath();ctx.arc(c.width/2,c.height/2,22,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#234bc0';ctx.lineWidth=3;for(let path of draw){if(!path.length)continue;ctx.beginPath();ctx.moveTo(...path[0]);for(let pt of path.slice(1))ctx.lineTo(...pt);ctx.stroke();if(path.length>1){let a=path.at(-2),b=path.at(-1),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(b[0]-13*Math.cos(ang-.5),b[1]-13*Math.sin(ang-.5));ctx.moveTo(...b);ctx.lineTo(b[0]-13*Math.cos(ang+.5),b[1]-13*Math.sin(ang+.5));ctx.stroke()}}}
function selectOption(b){b.classList.toggle('picked');let t=b.textContent;selected=b.classList.contains('picked')?[...selected,t]:selected.filter(x=>x!==t)}
function recordStep(){let key=current.type+':'+(current.id||'')+':'+(current.n||current.index)+':'+step;state.steps[key]=[selected.join(' | '),$('#answer')?.value||'',draw.length?'자유물체도 작성':''].filter(Boolean).join('\n');state.history.push({time:new Date().toISOString(),name:current.title||current.setName+' 문제 '+current.n,step:step+1,level});save();if(step<4){step++;selected=[];draw=[];practice()}else{toast('5단계 풀이 기록을 저장했습니다');show('report')}}
function checkExample(){let val=Number(($('#answer')?.value||'').replace(/[^0-9.+-]/g,'')),ans=current.answer;$('#feedback').innerHTML=Number.isFinite(val)&&Math.abs(val-ans)<.001?'<p style="color:green">정답입니다. '+ans+'</p>':'<p>정답: '+ans+' · 단위와 대입 과정을 확인하세요.</p>'}
function formula(){let topics=[...new Set(formulae.map(x=>x[0]))];$('#main').innerHTML='<h2>통합 공식 암기장</h2><p class="muted">학교 개념 단원에 해당하는 핵심 공식 카드입니다.</p>'+topics.map(t=>'<div class="panel"><h3>'+t+'</h3><div class="grid">'+formulae.filter(f=>f[0]===t).map(f=>'<div class="tile"><strong style="font-size:20px">'+f[1]+'</strong><span class="muted">'+f[2]+'</span></div>').join('')+'</div></div>').join('')}
function report(){$('#main').innerHTML='<h2>학습 기록</h2><div class="panel"><p>지금까지 기록한 풀이 단계 <strong>'+state.history.length+'회</strong></p><p class="small muted">이 기기에서만 학습 기록이 유지됩니다.</p><button class="secondary" onclick="exportBackup()">학습 기록 백업(JSON)</button> <label class="secondary" style="display:inline-block;cursor:pointer">기록 복원 <input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0])"></label></div><div class="panel">'+state.history.slice(-30).reverse().map(h=>'<p>'+new Date(h.time).toLocaleString('ko-KR')+' · '+esc(h.name)+' · '+h.step+'단계 · '+h.level+'</p>').join('')+'</div>'}
function exportBackup(){let blob=new Blob([JSON.stringify({history:state.history,steps:state.steps},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PHASE_학습기록.json';a.click();URL.revokeObjectURL(a.href)}
async function importBackup(f){if(!f)return;try{let data=JSON.parse(await f.text());state.history=data.history||[];state.steps=data.steps||{};save();report();toast('학습 기록 복원 완료')}catch(e){toast('올바른 JSON 파일이 아닙니다')}}
show('home');
</script></body></html>
